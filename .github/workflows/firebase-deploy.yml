name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vite inlines VITE_* values at build time, so these must be present
      # here rather than at runtime. Add them under Settings → Secrets and
      # variables → Actions. Any that are missing simply switch that feature
      # off in the deployed build: no Supabase means localStorage only, no
      # EmailJS means enquiries are still recorded but not emailed.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_CALLMEBOT_APIKEY: ${{ secrets.VITE_CALLMEBOT_APIKEY }}
          VITE_CALLMEBOT_PHONE: ${{ secrets.VITE_CALLMEBOT_PHONE }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/gcp-key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          set +e
          firebase deploy --only hosting --project vr-stores-9403d --non-interactive --debug > /tmp/deploy_output.txt 2>&1
          EXIT_CODE=$?
          {
            echo "## Firebase Deploy Output (exit code: $EXIT_CODE)"
            echo '```'
            tail -c 60000 /tmp/deploy_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT_CODE
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
