    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- Title leads with what people actually type ("AC service", "AC sales")
         and the place name, because these searches are overwhelmingly local. -->

      name="description"
      content="Air conditioner sales, installation, repair, gas filling, deep cleaning and AMC in Urapakkam, Chengalpattu. O General exclusive authorised dealer. Same-day AC service, all brands. Call 9940291467."
    />
    <link rel="canonical" href="https://www.vrstores.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Local signals: these help disambiguate which Urapakkam we mean. -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Urapakkam, Chengalpattu, Tamil Nadu" />
    <meta name="geo.position" content="12.86207;80.06134" />

    <!-- How the link looks when shared on WhatsApp, which is where most of
         this traffic will actually be passed around. -->

      property="og:title"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"

    <!--
      Structured data. This is what feeds the local results panel — the map
      card with hours and a call button — for searches like "AC service near
      me". It is plain HTML rather than injected by React so that crawlers see
      it without executing JavaScript.
    -->

        "@type": "HVACBusiness",
        "@id": "https://www.vrstores.in/#business",
        "name": "VR Store",
        "alternateName": "VR Store O General Exclusive AC Showroom",
        "description": "Air conditioner sales, installation, repair, deep cleaning and annual maintenance contracts in Urapakkam, Chengalpattu. O General exclusive authorised dealer servicing all major AC brands.",
        "url": "https://www.vrstores.in/",
        "logo": "https://www.vrstores.in/logo.png",
        "image": "https://www.vrstores.in/logo.png",
        "telephone": "+919940291467",
        "email": "vrstores.airconditioner@gmail.com",
        "priceRange": "₹₹",
        "currenciesAccepted": "INR",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plot No. 4, 1st Floor, Door No. 38, Rohini Nagar, Annai Anjugam Nagar",
          "addressLocality": "Urapakkam West",
          "addressRegion": "Tamil Nadu",
          "postalCode": "603211",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 12.86207,
          "longitude": 80.06134
        },
        "hasMap": "https://maps.app.goo.gl/yKGixWLWPscbxBky8",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "09:00",
            "closes": "20:00"
          }
        ],
        "areaServed": [
          { "@type": "City", "name": "Urapakkam" },
          { "@type": "City", "name": "Guduvanchery" },
          { "@type": "City", "name": "Vandalur" },
          { "@type": "City", "name": "Chengalpattu" },
          { "@type": "City", "name": "Maraimalai Nagar" },
          { "@type": "City", "name": "Singaperumal Koil" },
          { "@type": "City", "name": "Potheri" },
          { "@type": "City", "name": "Tambaram" }

        "brand": { "@type": "Brand", "name": "O General" },
        "makesOffer": [
          {
            "@type": "Offer",

          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AC Repair and Diagnostics",
              "description": "Same-day diagnosis and repair of all air conditioner faults."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AC Installation",

            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
